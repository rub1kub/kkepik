<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="width">
    <title>Судоку - KKEPIK</title>
    <script src="{{ url_for('static', filename='js/vendor/telegram-web-app.63.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/canvas-confetti.1.6.0.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/testmain.css') }}?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sudoku.css') }}?v={{ STATIC_VERSION }}">
</head>
<body>
    <div class="menu-container">
        <div class="header">
            <h1 class="sudoku-title">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
                </svg>
                <span>Судоку</span>
            </h1>
        </div>
        
        <div class="difficulty-modal" id="difficultyModal">
            <div class="modal-content">
                <h2>Выберите сложность</h2>
                <div class="difficulty-options">
                    <button class="difficulty-option" data-difficulty="easy">
                        <div class="difficulty-icon" aria-hidden="true">
                            <svg viewBox="0 0 32 32"><rect x="4" y="18" width="6" height="10" rx="2" /><rect x="13" y="11" width="6" height="17" rx="2" /><rect x="22" y="4" width="6" height="24" rx="2" /></svg>
                        </div>
                        <div class="difficulty-name">Легкий</div>
                        <div class="difficulty-desc">40+ клеток заполнено</div>
                    </button>
                    <button class="difficulty-option" data-difficulty="medium">
                        <div class="difficulty-icon" aria-hidden="true">
                            <svg viewBox="0 0 32 32"><rect x="4" y="18" width="6" height="10" rx="2" /><rect x="13" y="11" width="6" height="17" rx="2" /><rect x="22" y="4" width="6" height="24" rx="2" /></svg>
                        </div>
                        <div class="difficulty-name">Средний</div>
                        <div class="difficulty-desc">30+ клеток заполнено</div>
                    </button>
                    <button class="difficulty-option" data-difficulty="hard">
                        <div class="difficulty-icon" aria-hidden="true">
                            <svg viewBox="0 0 32 32"><rect x="4" y="18" width="6" height="10" rx="2" /><rect x="13" y="11" width="6" height="17" rx="2" /><rect x="22" y="4" width="6" height="24" rx="2" /></svg>
                        </div>
                        <div class="difficulty-name">Сложный</div>
                        <div class="difficulty-desc">20+ клеток заполнено</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Модальное окно окончания игры -->
        <div class="game-over-modal" id="gameOverModal" style="display: none;">
            <div class="modal-content">
                <div class="game-over-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
                        <path d="m4 4 16 16" />
                    </svg>
                </div>
                <h2>Игра окончена!</h2>
                <p>У вас закончились жизни. Попробуйте еще раз!</p>
                <div class="game-over-actions">
                    <button class="action-btn" onclick="window.sudokuGame.newGame()">Новая игра</button>
                    <button class="action-btn secondary" onclick="window.sudokuGame.closeGameOverModal()">Закрыть</button>
                </div>
            </div>
        </div>
        
        <div class="sudoku-game-container" id="gameContainer" style="display: none;">
            <div class="game-header">
                <div class="timer" id="timer">00:00</div>
                <div class="lives-container">
                    <span class="lives-label">Жизни:</span>
                    <div class="lives" id="lives">
                        <span class="life" aria-label="Жизнь"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /><path class="life-slash" d="m4 4 16 16" /></svg></span>
                        <span class="life" aria-label="Жизнь"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /><path class="life-slash" d="m4 4 16 16" /></svg></span>
                        <span class="life" aria-label="Жизнь"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /><path class="life-slash" d="m4 4 16 16" /></svg></span>
                    </div>
                </div>
                <div class="difficulty" id="difficulty">Легкий</div>
            </div>
            
            <div class="game-area">
                <div class="sudoku-board" id="sudokuBoard"></div>
            </div>
            
            <div class="sudoku-controls">
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(1)">1</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(2)">2</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(3)">3</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(4)">4</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(5)">5</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(6)">6</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(7)">7</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(8)">8</button>
                <button class="number-btn" onclick="window.sudokuGame.inputNumber(9)">9</button>
            </div>
            
            <div class="sudoku-controls">
                <button class="action-btn" onclick="window.sudokuGame.clearCell()">Очистить</button>
                <button class="action-btn" onclick="window.sudokuGame.toggleNotes()" id="notesBtn">Заметки</button>
                <button class="action-btn" onclick="window.sudokuGame.getHint()">Подсказка</button>
                <button class="action-btn danger" onclick="window.sudokuGame.newGame()">Новая игра</button>
            </div>
            
            <div class="rating-section">
                <div class="rating-title">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z" /><path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4" /></svg>
                    <span>Рейтинг игроков</span>
                </div>
                <div class="rating-tables">
                    <div class="rating-table-container">
                        <h3>Легкий</h3>
                        <table class="rating-table">
                            <thead>
                                <tr><th>#</th><th>Игрок</th><th>Время</th></tr>
                            </thead>
                            <tbody id="ratingEasyBody">
                                <tr><td colspan="3" style="text-align: center;">Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="rating-table-container">
                        <h3>Средний</h3>
                        <table class="rating-table">
                            <thead>
                                <tr><th>#</th><th>Игрок</th><th>Время</th></tr>
                            </thead>
                            <tbody id="ratingMediumBody">
                                <tr><td colspan="3" style="text-align: center;">Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="rating-table-container">
                        <h3>Сложный</h3>
                        <table class="rating-table">
                            <thead>
                                <tr><th>#</th><th>Игрок</th><th>Время</th></tr>
                            </thead>
                            <tbody id="ratingHardBody">
                                <tr><td colspan="3" style="text-align: center;">Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/sudoku.js') }}?v={{ STATIC_VERSION }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.sudokuGame = new SudokuGame();
            window.sudokuGame.init();
        });
    </script>
</body>
</html>
