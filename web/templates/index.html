<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="width">
    <title>KKEPIK</title>
    <link rel="icon" href="data:,">
    <script>
        (function () {
            var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || ''))) {
                document.documentElement.classList.add('low-data');
            }
        }());
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ STATIC_VERSION }}">
    <script defer src="{{ url_for('static', filename='js/vendor/telegram-web-app.63.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/app_bootstrap.js') }}?v={{ STATIC_VERSION }}"></script>
    <script defer src="{{ url_for('static', filename='js/effects.js') }}?v={{ STATIC_VERSION }}"></script>
    <script defer src="{{ url_for('static', filename='js/swipe_detector.js') }}?v={{ STATIC_VERSION }}"></script>
    <script defer src="{{ url_for('static', filename='js/schedule.js') }}?v={{ STATIC_VERSION }}"></script>
    <script defer src="{{ url_for('static', filename='js/main.js') }}?v={{ STATIC_VERSION }}"></script>
    <style>
        #loader {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            margin-bottom: 10px;
            color: var(--tg-theme-hint-color);
            transition: opacity 0.18s ease-out;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            border: 2px solid rgba(127, 127, 127, 0.22);
            border-top-color: var(--tg-theme-button-color);
            border-radius: 50%;
            animation: loader-spin 0.8s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }
        .beta-label {
            position: absolute;
            top: 10px;
            right: 12px;
            background: #ff5722;
            color: #fff;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
            letter-spacing: 1px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .game-card { position: relative; }
        
    </style>
</head>
<body>
    <div id="auth-error" style="display:none;color:red;text-align:center;margin-top:30px;font-size:18px;">Ошибка авторизации через Telegram. Попробуйте открыть приложение заново.</div>
    <div class="menu-container" id="main-content" style="display:none;">
        <div id="connection-status" class="connection-status" role="status" hidden></div>
        <div id="loader" role="status" aria-live="polite">
            <span class="loader-spinner" aria-hidden="true"></span>
            <span class="loader-text">Загружаем расписание</span>
        </div>
        <!-- Выбор группы/ФИО -->
        <div id="groupSelectorContainer" class="group-selector-container">
            <span id="currentGroupName" class="group-selector-current"></span>
            <div id="groupQuickSwitch" class="group-quick-switch" role="tablist" aria-label="Отслеживаемые расписания" hidden></div>
            <button id="groupSelectorManage" class="group-selector-manage" type="button" hidden>Добавить</button>
            <span id="groupSelectorArrow" class="group-selector-arrow" hidden>&#8250;</span>
        </div>
        <div id="groupSelectorDropdown" class="group-selector-dropdown"></div>
        <div id="progressBox">
            <div id="progress_bar" role="button" tabindex="0" aria-label="Оставшееся время">
                <div id="progress_line"></div>
                <div id="timeBox">
                    <div class="text" id="timerPassed">--:--</div>
                    <div class="text" id="timerLeft">до пары</div>
                </div>
            </div>
        </div>

        <div id="pairs_block">
            <div class="schedule-container" style="display:none;">
                <div class="schedule-column" style="display:none;">
                    <div class="schedule-title"></div>
                    <div class="wrap list" id="bell_list">
                        <div class="row-container"></div>
                    </div>
                </div>
                <div class="schedule-column" style="display:none;">
                    <div class="schedule-title"></div>
                    <div class="wrap list" id="saturday_bell_list">
                        <div class="row-container"></div>
                    </div>
                </div>
            </div>
            <script>document.addEventListener('DOMContentLoaded',function(){var scheduleContainer=document.querySelector('.schedule-container');if(scheduleContainer)scheduleContainer.style.display='';var saturdayCol=document.querySelector('.schedule-column:last-child');if(saturdayCol)saturdayCol.style.display='none';var weekdayCol=document.querySelector('.schedule-column:first-child');if(weekdayCol){weekdayCol.style.display='';weekdayCol.style.flex='1';}});</script>
        </div>
        
        <!-- Контейнер для реакций и кнопки скачать -->
        <div id="scheduleActions" style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;" hidden>
            <div id="downloadScheduleBtn" class="download-btn">Скачать</div>
            <div id="schedule-reactions"></div>
        </div>
        
        <hr class="section-divider">
        <div class="games-grid">
            <a href="{{ url_for('schedule_search') }}?tgWebAppData={{ '{{' }} tgWebAppData {{ '}}' }}" class="game-card schedule-card">
                <span class="schedule-card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 3v3M17 3v3M4 9h16" />
                        <rect x="4" y="5" width="16" height="16" rx="3" />
                        <path d="M8 13h3M8 17h8" />
                    </svg>
                </span>
                <span class="schedule-card-copy">
                    <span class="game-title">Найти расписание</span>
                    <span class="game-description">Группа, преподаватель или аудитория</span>
                </span>
                <svg class="schedule-card-arrow" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </a>

            <section class="compact-games-section" aria-labelledby="compact-games-title">
                <h2 id="compact-games-title">Игры</h2>
                <div class="compact-games-list">
                    <a href="{{ url_for('game_page', game_name='snake') }}" class="compact-game-link">
                        <span class="compact-game-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M5 5h9a4 4 0 0 1 0 8H9a3 3 0 0 0 0 6h8" />
                                <circle cx="19" cy="19" r="1" />
                            </svg>
                        </span>
                        <span>Змейка</span>
                    </a>
                    <a href="{{ url_for('sudoku') }}?tgWebAppData={{ '{{' }} tgWebAppData {{ '}}' }}" class="compact-game-link">
                        <span class="compact-game-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
                            </svg>
                        </span>
                        <span>Судоку</span>
                    </a>
                    <a href="{{ url_for('game_page', game_name='2048') }}" class="compact-game-link">
                        <span class="compact-game-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="3" width="8" height="8" rx="2" />
                                <rect x="13" y="3" width="8" height="8" rx="2" />
                                <rect x="3" y="13" width="8" height="8" rx="2" />
                                <rect x="13" y="13" width="8" height="8" rx="2" />
                                <path d="M6 6.5h2L6 9h2M16 6h2v3M16 16h2v3M6 16h2v3" />
                            </svg>
                        </span>
                        <span>2048</span>
                    </a>
                </div>
            </section>

            <button class="feedback-link" id="reviewCard" type="button" aria-haspopup="dialog" aria-controls="reviewModal">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 18h6M10 22h4" />
                    <path d="M8.2 14.5A7 7 0 1 1 15.8 14.5C14.6 15.4 14 16.4 14 18h-4c0-1.6-.6-2.6-1.8-3.5Z" />
                </svg>
                Предложить идею
            </button>
        </div>
    </div>

    <!-- Модальное окно для отзыва (перенесено вниз, вне menu-container) -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <span class="close" id="closeReviewModal">&times;</span>
            <h2>Предложить идею</h2>
            <div class="review-mark-group">
                <label>Ваша оценка:</label>
                <div class="review-marks" id="reviewMarks">
                    <!-- Кнопки оценок 1-10 -->
                    {% for i in range(1, 11) %}
                    <button type="button" class="mark-btn" data-mark="{{ i }}">{{ i }}</button>
                    {% endfor %}
                </div>
            </div>
            <div class="review-text-group">
                <label for="reviewText">Ваш отзыв:</label>
                <textarea id="reviewText" maxlength="500" placeholder="Напишите, что можно добавить или что можно изменить..." required></textarea>
            </div>
            <button class="review-send-btn" id="sendReviewBtn">Отправить</button>
            <div class="review-status" id="reviewStatus"></div>
        </div>
    </div>

    <script>
        // Обработчик для плашки поздравлятора
        document.addEventListener('DOMContentLoaded', function() {
            const congratulatorCTA = document.getElementById('congratulatorCTA');
            if (congratulatorCTA) {
                congratulatorCTA.addEventListener('click', function(e) {
                    // Добавляем тактильную обратную связь если доступно
                    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                        Telegram.WebApp.HapticFeedback.impactOccurred('light');
                    }
                });
            }
        });

    </script>
</body>
</html>
