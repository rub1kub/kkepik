# Include once from Apache's global configuration.
# All college hostnames share this daemon and the same persistent canvas.
WSGIDaemonProcess kkepik_canvas user=www-data group=www-data processes=1 threads=4 python-home=/var/www/kkepik.ru/venv python-path=/var/www/kkepik.ru queue-timeout=2 request-timeout=10 socket-timeout=10 maximum-requests=20000 display-name=%{GROUP}
