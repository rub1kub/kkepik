# Include inside each college VirtualHost, BEFORE its WSGIScriptAlias /.
WSGIScriptAlias /api/pixels /var/www/kkepik.ru/pixel_canvas.wsgi process-group=kkepik_canvas application-group=%{GLOBAL}

# A direct link saves the completed, public artwork video as a file.
<LocationMatch "^/static/exports/pixel-battle-[0-9-]+-[a-f0-9]+\.mp4$">
    Header set Content-Disposition "attachment"
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
